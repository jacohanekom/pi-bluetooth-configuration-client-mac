name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Real Bluetooth hardware doesn't matter for a compile check, but this
    # does need a real macOS toolchain (CoreBluetooth/SwiftUI headers) --
    # unlike the Alpine daemons in this project family, there's no Docker
    # shortcut for that, so this runs on GitHub's hosted macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v
