name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# This account's default GITHUB_TOKEN workflow permission is read-only,
# so the release step below would otherwise fail with "Resource not
# accessible by integration" on every tag push.
permissions:
  contents: write

jobs:
  build:
    # Real Bluetooth hardware doesn't matter for a compile check, but this
    # does need a real macOS toolchain (CoreBluetooth/SwiftUI headers) --
    # unlike the Alpine daemons in this project family, there's no Docker
    # shortcut for that, so this runs on GitHub's hosted macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Build .app bundle
        run: make app

      - name: Verify bundle structure and signature
        run: |
          test -x pi-bluetooth-configuration-client-mac.app/Contents/MacOS/pi-bluetooth-configuration-client-mac
          plutil -lint pi-bluetooth-configuration-client-mac.app/Contents/Info.plist
          codesign -dv pi-bluetooth-configuration-client-mac.app

      - name: Zip .app bundle
        run: |
          # ditto (not plain zip) preserves the bundle's extended
          # attributes/code signature correctly.
          ditto -c -k --keepParent pi-bluetooth-configuration-client-mac.app pi-bluetooth-configuration-client-mac-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pi-bluetooth-configuration-client-mac
          path: pi-bluetooth-configuration-client-mac-macos.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-bluetooth-configuration-client-mac-macos.zip
